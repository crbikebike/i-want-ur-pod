<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog · arcs</title>
<link rel="stylesheet" href="/app.css">
</head>
<body>
<div class="app">

    <div class="brand">i want ur pod <span>· arcs</span></div>

  </aside>

  <main class="main">

      <nav class="viewnav" aria-label="Views">
        <a href="#/" data-view="catalog">Catalog</a>

      <input class="search" id="q" type="search" placeholder="Search shows…" aria-label="Search shows">
      <select class="cat" id="cat" aria-label="Filter by category"></select>
      <span class="result-count" id="count"></span>
      <button class="icon-btn" id="theme" aria-label="Toggle light and dark">◐</button>
    </div>
    <div class="view" id="view"><p class="empty">Loading…</p></div>
  </main>
</div>
<script src="/app.js"></script>
