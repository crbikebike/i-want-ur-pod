<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Catalog workbench</title>
<link rel="stylesheet" href="/app.css">
</head>
<body data-mode="browse">
<div class="shell">
  <aside class="rail" id="rail">
    <div class="brand">i want ur pod <b>· workbench</b></div>
    <nav class="modes" id="modes" aria-label="Mode"></nav>
    <button class="ftoggle" id="ftoggle" aria-expanded="false" aria-controls="facets">Filters</button>
    <div class="facets" id="facets"></div>
    <div class="progress" id="progress"></div>
  </aside>

  <main class="main">
    <div class="topbar">
      <div class="searchwrap">
        <input class="search" id="q" type="search" placeholder="Search shows, arcs, themes…" aria-label="Search">
        <span class="slash">/</span>
      </div>
      <span class="crumb" id="crumb"></span>
      <button class="icon-btn" id="theme" aria-label="Toggle light and dark">◐</button>
    </div>
    <div class="view" id="view"><p class="empty">Loading…</p></div>
  </main>
</div>
<script src="/app.js"></script>
</body>
</html>
