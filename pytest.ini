# Without this file, pytest from the repo root collected only admin/api/tests -- 319
# tests -- and silently skipped catalog/build/tests' 130-odd. "319 passed" was true and
# incomplete for weeks, the same shape as a comb that logs a clean run while skipping a
# quarter of the catalog.
#
# The culprit is pytest's default norecursedirs, which includes the literal pattern
# `build` -- aimed at setuptools build/ dirs, but it swallows catalog/build/ too. So the
# override below repeats the useful defaults minus that one word.
[pytest]
testpaths = admin catalog
norecursedirs = .git .* node_modules __pycache__ *.egg dist venv design curation
